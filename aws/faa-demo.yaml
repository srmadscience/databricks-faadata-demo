AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  databricks-faadata-demo on one EC2 instance: Grafana with the FAA dashboards,
  querying an existing Databricks workspace, and the loader, which can also load
  the data. Ports 22 (SSH) and 3000 (Grafana) are open. Setup takes about 5
  minutes after the stack is created, plus any loading; follow it in
  /var/log/faa-setup.log.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH as the ubuntu user
  InstanceType:
    Type: String
    Default: m7i.large
    AllowedValues: [t3.medium, t3.large, t3.xlarge, m7i.large, m7i.xlarge, m7i.2xlarge]
    Description: >-
      x86_64 instance type. Grafana alone needs little; the loader converts files
      on several cores, so loading is faster on a larger instance
  VolumeSize:
    Type: Number
    Default: 40
    MinValue: 20
    Description: Root volume size in GB (the full set of downloaded files is about 5 GB)
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: ^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$
    Description: Addresses allowed to reach SSH and Grafana, e.g. your-ip/32
  GrafanaPassword:
    Type: String
    Default: hiredavid
    NoEcho: true
    MinLength: 4
    Description: Password for Grafana's admin user
  DatabricksHost:
    Type: String
    AllowedPattern: ^[a-zA-Z0-9.-]+$
    Description: Workspace host name, without https://, e.g. dbc-1234abcd-5678.cloud.databricks.com
  DatabricksToken:
    Type: String
    NoEcho: true
    MinLength: 10
    Description: >-
      Personal access token. Kept in an AWS Secrets Manager secret that only the
      instance can read, and written to the repository's databricks.properties
  DatabricksWarehouseId:
    Type: String
    AllowedPattern: ^[a-zA-Z0-9]+$
    Description: SQL warehouse ID (the last part of its HTTP path, /sql/1.0/warehouses/<id>)
  DatabricksCatalog:
    Type: String
    Default: main
    AllowedPattern: ^[a-zA-Z0-9_]+$
    Description: Catalog holding the faa schema (on Free Edition, workspace)
  LoadFrom:
    Type: String
    Default: none
    AllowedPattern: ^(\d{4}-\d{2}|none)$
    Description: >-
      First month of flights to load (YYYY-MM), or "none" to load nothing, for a
      workspace that has the data already
  LoadTo:
    Type: String
    Default: 2026-07
    AllowedPattern: ^\d{4}-\d{2}$
    Description: Last month of flights to load (YYYY-MM)
  RepoUrl:
    Type: String
    Default: https://github.com/srmadscience/databricks-faadata-demo.git
    Description: Git repository to install
  RepoBranch:
    Type: String
    Default: main
    Description: Branch, tag or commit of the repository
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Ubuntu 24.04 AMI (the latest, by default)

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH and Grafana
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AllowedCidr, Description: SSH}
        - {IpProtocol: tcp, FromPort: 3000, ToPort: 3000, CidrIp: !Ref AllowedCidr, Description: Grafana}
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]

  # The token is kept out of the instance's user data, which anything on the
  # instance can read: the instance fetches it from here with its own role.
  TokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub Databricks personal access token for ${AWS::StackName}
      SecretString: !Ref DatabricksToken

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: sts:AssumeRole}
      Policies:
        - PolicyName: read-databricks-token
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: !Ref TokenSecret}

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      IamInstanceProfile: !Ref InstanceProfile
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref SecurityGroup]
      MetadataOptions: {HttpTokens: required}
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {VolumeSize: !Ref VolumeSize, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]
      # The repository's scripts/install-server.sh does the work; this clones the
      # repository and runs it. The Grafana password goes through a root-only file
      # rather than the command line, and the token from the secret through the
      # environment.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee -a /var/log/faa-setup.log) 2>&1
          echo "=== $(date '+%H:%M:%S') Cloning ${RepoUrl} (${RepoBranch})"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q && apt-get install -y -q git
          snap list aws-cli > /dev/null 2>&1 || snap install aws-cli --classic
          REPO=/home/ubuntu/databricks-faadata-demo
          [[ -d "$REPO" ]] || sudo -u ubuntu git clone -q "${RepoUrl}" "$REPO"
          sudo -u ubuntu git -C "$REPO" checkout -q "${RepoBranch}"
          install -m 600 /dev/null /root/grafana-password
          cat > /root/grafana-password <<'PASSWORD_EOF'
          ${GrafanaPassword}
          PASSWORD_EOF
          DATABRICKS_TOKEN=$(/snap/bin/aws secretsmanager get-secret-value --region "${AWS::Region}" \
            --secret-id "${TokenSecret}" --query SecretString --output text)
          export DATABRICKS_TOKEN DATABRICKS_HOST="${DatabricksHost}" \
                 DATABRICKS_WAREHOUSE_ID="${DatabricksWarehouseId}" DATABRICKS_CATALOG="${DatabricksCatalog}"
          GRAFANA_PASSWORD=$(cat /root/grafana-password) APP_USER=ubuntu \
            "$REPO/scripts/install-server.sh" "${LoadFrom}" "${LoadTo}"
          rm -f /root/grafana-password

Outputs:
  GrafanaUrl:
    Description: Grafana (user admin)
    Value: !Sub http://${Instance.PublicDnsName}:3000
  SshCommand:
    Description: SSH to the instance; setup log in /var/log/faa-setup.log
    Value: !Sub ssh ubuntu@${Instance.PublicDnsName}
  PublicIp:
    Value: !GetAtt Instance.PublicIp
