type: "transformation"
version: "1.0"
pipeline:
  metadata:
    origin: "maia-01a1f9f2-32b0-7bec-8f57-e7560f0073cc"
    description: "One row per maintenance gap (run of consecutive days with no completed flights) for each leased aircraft: start of the flying run, days flown before the gap, gap start and days in maintenance"
  components:
    Daily Operations:
      type: "table-input"
      parameters:
        componentName: "Daily Operations"
        catalog: "[Environment Default]"
        schema: "[Environment Default]"
        targetTable: "tail_day"
        columnNames:
        - "FlightDate"
        - "tail"
        - "completed"
        metadataColumnNames:
        offsetType: "None"
    Leased Airplanes:
      type: "table-input"
      parameters:
        componentName: "Leased Airplanes"
        catalog: "[Environment Default]"
        schema: "[Environment Default]"
        targetTable: "leased_airplanes"
        columnNames:
        - "Tail_Number"
        metadataColumnNames:
        offsetType: "None"
    Flown Days Only:
      type: "filter"
      sources:
      - "Daily Operations"
      parameters:
        componentName: "Flown Days Only"
        mode: "Basic"
        filterConditions:
        - - "completed"
          - "Is"
          - "Greater than"
          - "0"
        combineCondition: "And"
    Leased Flights:
      type: "join"
      sources:
      - "Leased Airplanes"
      - "Flown Days Only"
      parameters:
        componentName: "Leased Flights"
        mainTable: "Leased Airplanes"
        mainTableAlias: "la"
        joins:
        - - "Flown Days Only"
          - "d"
          - "Inner"
        joinExpressions:
        - - "`la`.`Tail_Number` = `d`.`tail`"
          - "la_Inner_d"
        columnMappings:
        - - "la.Tail_Number"
          - "Tail_Number"
        - - "d.FlightDate"
          - "FlightDate"
    One Row per Flown Day:
      type: "aggregate"
      sources:
      - "Leased Flights"
      parameters:
        componentName: "One Row per Flown Day"
        groupings:
        - "Tail_Number"
        - "FlightDate"
        aggregations:
        - - "FlightDate"
          - "Count"
        groupingType: "Group By"
    First Flight:
      type: "window-calculation"
      sources:
      - "One Row per Flown Day"
      parameters:
        componentName: "First Flight"
        includeInputColumns: "Yes"
        partitionData:
        - "Tail_Number"
        functions:
        - - "Minimum"
          - "FlightDate"
          - "first_flight"
    Previous Flight:
      type: "lead-lag"
      sources:
      - "First Flight"
      parameters:
        componentName: "Previous Flight"
        includeInputColumns: "Yes"
        partitionData:
        - "Tail_Number"
        orderingsWithinPartitions:
        - - "FlightDate"
          - "Ascending"
        functions:
        - - "Lag"
          - "FlightDate"
          - "1"
          - "prev_flight"
    Gap Length:
      type: "calculator"
      sources:
      - "Previous Flight"
      parameters:
        componentName: "Gap Length"
        includeInputColumns: "Yes"
        calculations:
        - - "DATEDIFF(`FlightDate`, `prev_flight`) - 1"
          - "gap_days"
    Gaps Only:
      type: "filter"
      sources:
      - "Gap Length"
      parameters:
        componentName: "Gaps Only"
        mode: "Basic"
        filterConditions:
        - - "gap_days"
          - "Is"
          - "Greater than"
          - "0"
        combineCondition: "And"
    Previous Gap End:
      type: "lead-lag"
      sources:
      - "Gaps Only"
      parameters:
        componentName: "Previous Gap End"
        includeInputColumns: "Yes"
        partitionData:
        - "Tail_Number"
        orderingsWithinPartitions:
        - - "FlightDate"
          - "Ascending"
        functions:
        - - "Lag"
          - "FlightDate"
          - "1"
          - "prev_resume"
    Maintenance Gaps:
      type: "calculator"
      sources:
      - "Previous Gap End"
      parameters:
        componentName: "Maintenance Gaps"
        includeInputColumns: "No"
        calculations:
        - - "`Tail_Number`"
          - "Tail_Number"
        - - "COALESCE(`prev_resume`, `first_flight`)"
          - "start_date"
        - - "DATEDIFF(`prev_flight`, COALESCE(`prev_resume`, `first_flight`)) + 1"
          - "days_with_flights"
        - - "DATE_ADD(`prev_flight`, 1)"
          - "maintenance_start"
        - - "`gap_days`"
          - "days_in_maintenance"
design:
  components:
    Daily Operations:
      position:
        x: 0
        "y": 100
    Leased Airplanes:
      position:
        x: 0
        "y": 0
    Flown Days Only:
      position:
        x: 150
        "y": 100
    Leased Flights:
      position:
        x: 300
        "y": 0
    One Row per Flown Day:
      position:
        x: 450
        "y": 0
    First Flight:
      position:
        x: 600
        "y": 0
    Previous Flight:
      position:
        x: 750
        "y": 0
    Gap Length:
      position:
        x: 900
        "y": 0
    Gaps Only:
      position:
        x: 1050
        "y": 0
    Previous Gap End:
      position:
        x: 1200
        "y": 0
    Maintenance Gaps:
      position:
        x: 1350
        "y": 0
