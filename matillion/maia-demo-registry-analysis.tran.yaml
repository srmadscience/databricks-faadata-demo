    Aggregate:
      type: "aggregate"
      sources:
      - "Create subtotals for cancel codes"
      parameters:
        componentName: "Aggregate"
        groupings:
        - "Tail_Number"
        - "Month"
        - "Year"
        - "model"
        - "make_model"
        - "year_mfr"
        - "seats"
        - "engines"
        aggregations:
        - - "OK"
          - "Sum"
        - - "Other"
          - "Sum"
        - - "Maintenance"
          - "Sum"
        - - "Distance"
          - "Sum"
        - - "DepDelay"
          - "Sum"
        - - "ActualElapsedTime"
          - "Sum"
        - - "Tail_Number"
          - "Count"
        groupingType: "Group By"
    Check Cancel codes:
      type: "map-values"
      sources:
      - "Join"
      parameters:
        componentName: "Check Cancel codes"
        valueMap:
        - - "CancellationCode"
          - "Is"
          - "Null or blank"
          - ""
          - "OK"
        - - "CancellationCode"
          - "Is"
          - "Equal to"
          - "A"
          - "Maintenance"
        - - "CancellationCode"
          - "Is"
          - "Greater than"
          - "A"
          - "Other"
        columnName: "cance"
        other: "Other"
    Create subtotals for cancel codes:
      type: "calculator"
      sources:
      - "Check Cancel codes"
      parameters:
        componentName: "Create subtotals for cancel codes"
        includeInputColumns: "Yes"
        calculations:
        - - "CASE WHEN `cance` = 'OK' THEN 1 ELSE 0 END"
          - "OK"
        - - "CASE WHEN `cance` = 'Other' THEN 1 ELSE 0 END"
          - "Other"
        - - "CASE WHEN `cance` = 'Maintenance' THEN 1 ELSE 0 END"
          - "Maintenance"
        - - "CASE WHEN `DepDelay` < 0 THEN 0 ELSE `DepDelay` END"
          - "DepDelay"
    Clean up column names:
      type: "rename"
      sources:
      - "Aggregate"
      parameters:
        componentName: "Clean up column names"
        columnMapping:
        - - "sum_OK"
          - "OK"
        - - "sum_Other"
          - "Other"
        - - "sum_Maintenance"
          - "Maintenance"
        - - "count_Tail_Number"
          - "flight_count"
        includeInputColumns: "Yes"
    Calculate avg flight length:
      type: "calculator"
      sources:
      - "Clean up column names"
      parameters:
        componentName: "Calculate avg flight length"
        includeInputColumns: "Yes"
        calculations:
        - - "FLOOR(`sum_Distance` / `flight_count`)"
          - "avg_flght_length"
        - - "MAKE_DATE(`Year`, `Month`, 1)"
          - "month_start"
    Rewrite Table:
      type: "rewrite-table-dl"
      sources:
      - "Calculate avg flight length"
      parameters:
        componentName: "Rewrite Table"
        catalog: "[Environment Default]"
        schema: "[Environment Default]"
        table: "leased_plans_summary"
        partitionKeys:
        tableProperties:
        comment:
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
        updateGridVariables:
