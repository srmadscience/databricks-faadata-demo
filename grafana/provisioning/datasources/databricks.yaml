# Installed by scripts/grafana-provision.sh, which fills in __DATABRICKS_HOST__
# and __HTTP_PATH__ (the SQL warehouse's) and supplies DATABRICKS_TOKEN to
# grafana-server's environment. Requires the community Databricks plugin,
# mullerpeter-databricks-datasource (1.3 or later), which is unsigned, so
# grafana.ini must allow it (allow_loading_unsigned_plugins).
# The dashboards refer to this datasource by its uid, databricks-faa.
apiVersion: 1
datasources:
  - name: Databricks FAA
    type: mullerpeter-databricks-datasource
    uid: databricks-faa
    isDefault: true
    jsonData:
      hostname: __DATABRICKS_HOST__
      port: "443"
      path: __HTTP_PATH__
      # dsn = personal access token
      authenticationMethod: dsn
      # The plugin returns at most this many rows; its default, 10,000, would
      # cut off a year of one airport's weather reports.
      maxRows: "100000"
      # A serverless warehouse that has stopped takes a few seconds to start.
      retries: "3"
      retryBackoff: "2"
      maxRetryDuration: "120"
      defaultQueryFormat: table
      defaultEditorMode: code
    secureJsonData:
      token: ${DATABRICKS_TOKEN}
